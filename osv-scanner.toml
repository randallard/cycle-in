# Mirrors pnpm-workspace.yaml's `auditConfig.ignoreGhsas` — the two scanners read
# separate config and separate databases (project-conventions/SKILL.md, Supply
# chain), so an ignore has to be written once per scanner. Keep these two files'
# ignore lists identical and drop entries from both together.
#
# Every entry here is a transitive dev-tooling dependency whose only patched
# version is younger than the 14-day age-gate in pnpm-workspace.yaml
# (ADR-0008) as of 2026-09-18 — genuinely no *usable* patched version exists
# yet, not a severity opinion. `ignoreUntil` matches the date each clears 14
# days, so the ignore expires itself instead of needing a reminder.
#
# Note this scanner's `fail-on-vuln` (set true by the reusable workflow) fails
# on *any* severity, unlike `pnpm audit --audit-level=high` — checked against
# a real CI run, not assumed, after the first pass here only covered High.

