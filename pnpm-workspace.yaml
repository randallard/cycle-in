# Native build scripts are blocked by default (ADR-0002, npm supply-chain discipline).
# Anything listed here has been individually reviewed, not blanket-approved.
allowBuilds:
  # Optional peer of @cyclonedx/cyclonedx-library, only used for XML-format SBOM
  # output. We generate JSON SBOMs only (matches git-redundancy's `cargo cyclonedx
  # --format json`), so its native build script is deliberately never needed —
  # reviewed 2026-07-08, not silently skipped.
  libxmljs2: false
onlyBuiltDependencies: []

# --- Install-time supply-chain gates (ADR-0002 decision 11, added 2026-07-18) ---
# pnpm's own recommended baseline (https://pnpm.io/supply-chain-security). These
# apply to *every* install, unlike renovate.json's `minimumReleaseAge`, which only
# paces Renovate's own PRs and does nothing for a manual `pnpm add`.

# 1 day, in minutes (ADR-0015, superseding ADR-0008's 14): pnpm's own recommendation and
# v11 default, deliberately matched to renovate.json's `minimumReleaseAge` so both paths
# quarantine a new release for the same window.
minimumReleaseAge: 1440

# Fail the install if a package's trust evidence has *decreased* versus its
# previous releases (e.g. provenance attestations disappearing) — the closest
# native signal to "this specific version looks wrong right now," which the
# advisory-database scanners can't give us until something is disclosed.
trustPolicy: no-downgrade

# Transitive dependencies must resolve from the registry — no git URLs, no
# arbitrary tarball links smuggled in by a sub-dependency.
blockExoticSubdeps: true

# --- Transitive vulnerability fixes (2026-09-18) ---
# `pnpm audit --audit-level=high` and osv-scan (which, via the reusable
# workflow's `fail-on-vuln: true`, fails on *any* severity, not just high —
# checked against the actual CI run, not assumed) gate CI (ADR-0009). None of
# the packages below are direct dependencies; all are pulled in transitively
# by an exact-pinned direct dep (vite -> postcss, license-checker-rseidelsohn
# -> ... -> tar/undici), so the fix is an override, not a package.json bump.
# Overrides on a bare name or `name@major` so none can jump a major version.
overrides:
  postcss: "8.5.23" # GHSA-r28c-9q8g-f849 (path traversal) + GHSA-fxqj-rqcc-2cmp, published 2026-09-03
  tar: "7.5.21" # GHSA-r292-9mhp-454m (uncontrolled recursion DoS), published 2026-07-24
  undici: "6.29.1" # GHSA-8xcm-r25x-g524 / GHSA-m8rv-5g2x-5cg5 / GHSA-v3r7-h72x-cjcm, then GHSA-rfgv-xxqx-mfg5 / GHSA-3wwx-pv8p-q78v / GHSA-r53p-7pc4-xj5r, then (2026-10-31) GHSA-2m5v-pch6-74hx / GHSA-4qv8-2p9j-2685 / GHSA-9fm3-97px-rjf6 / GHSA-qrxm-fqhp-jwvm / GHSA-xjj6-f33q-929c
  "brace-expansion@5": "^5.0.12" # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  "ip-address": "^10.7.1" # GHSA-mwp4-54f8-5fhr, GHSA-22jq-vg5j-6vgg, GHSA-4xrf-jv44-h6hh, GHSA-2vr4-cq9g-pvrc, GHSA-rpw4-54j3-4h4q, GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv
  "http-cache-semantics": "^4.2.1" # GHSA-ch52-4w7c-c8xp
  "source-map-js": "^1.2.2" # GHSA-68fv-2mgg-jv7q
  "postcss-selector-parser@7": "^7.1.6" # GHSA-rj75-hqrm-r3gf

  # The two exceptions to the same-major rule above, deliberately (2026-10-31). Neither advisory
  # has a fix on the line in the lockfile, only in a new major (both released 2026-10-27), and
  # the consumers (eslint; license-checker's @npmcli internals) haven't moved yet. This repo has
  # no minimatch 3 (the-lot and square-one do, and ignore minimatch instead for that reason), so
  # the override reaches every copy. Measured with the jump in place: lint, tests, build, audit,
  # signatures, the licence allowlist and OSV all pass. Upper-bounded so it can't drift a
  # further major. Fallback if a consumer breaks: an ignore in both scanners (ADR-0015), never an
  # unbounded range. Drop each once its consumers require it. Same as branching-video.
  "glob@13": ">=14.0.2 <15" # GHSA-3g3m-2fjr-6pw4
  "minimatch@10": ">=11.0.1 <12" # GHSA-g3hv-75wg-m249
  # nanoid needed no override of its own: postcss@8.5.23's own dependency
  # range already resolves it to 3.3.18, clearing GHSA-28wg-ghj8-5hjv and
  # GHSA-2v37-7h3g-55p8 as a side effect — confirmed via `pnpm why nanoid`,
  # not assumed. No ignore entry needed for either.
