# Native build scripts are blocked by default (ADR-0002, npm supply-chain discipline).
# Anything listed here has been individually reviewed, not blanket-approved.
allowBuilds:
  # Optional peer of @cyclonedx/cyclonedx-library, only used for XML-format SBOM
  # output. We generate JSON SBOMs only (matches git-redundancy's `cargo cyclonedx
  # --format json`), so its native build script is deliberately never needed —
  # reviewed 2026-07-08, not silently skipped.
  libxmljs2: false
onlyBuiltDependencies: []

# --- Install-time supply-chain gates (ADR-0002 decision 11, added 2026-07-18) ---
# pnpm's own recommended baseline (https://pnpm.io/supply-chain-security). These
# apply to *every* install, unlike renovate.json's `minimumReleaseAge`, which only
# paces Renovate's own PRs and does nothing for a manual `pnpm add`.

# 14 days, in minutes — deliberately matched to renovate.json's `minimumReleaseAge`
# so both paths quarantine a new release for the same window. pnpm 11 would
# otherwise default to 1440 (1 day). Most npm compromises are caught within hours
# to days, so the wait is where the real protection is.
minimumReleaseAge: 20160

# Fail the install if a package's trust evidence has *decreased* versus its
# previous releases (e.g. provenance attestations disappearing) — the closest
# native signal to "this specific version looks wrong right now," which the
# advisory-database scanners can't give us until something is disclosed.
trustPolicy: no-downgrade

# Transitive dependencies must resolve from the registry — no git URLs, no
# arbitrary tarball links smuggled in by a sub-dependency.
blockExoticSubdeps: true

# --- Transitive vulnerability fixes (2026-09-18) ---
# `pnpm audit --audit-level=high` and osv-scan gate CI (ADR-0009). Neither
# package below is a direct dependency; both are pulled in transitively by an
# exact-pinned direct dep (vite -> postcss, license-checker-rseidelsohn ->
# ... -> tar), so the fix is an override, not a package.json version bump.
# Both patched versions clear the 14-day age-gate above (ADR-0008) as of this
# date — postcss@8.5.18 published 2026-09-03, tar@7.5.21 published 2026-07-24.
overrides:
  postcss: "8.5.18" # GHSA-r28c-9q8g-f849 (path traversal via sourceMappingURL)
  tar: "7.5.21" # GHSA-r292-9mhp-454m (uncontrolled recursion DoS)

# Advisories found 2026-09-18 whose only patched version is younger than the
# 14-day age-gate above — genuinely no *usable* patched version exists yet,
# not a severity opinion or a lazy "waiting" excuse (see
# .claude/skills/project-conventions/SKILL.md, Supply chain). All are
# transitive dev-tooling deps (eslint's minimatch, license-checker's socks
# chain, vite's postcss) with no attacker-controlled input in this project's
# own CI, so quarantining rather than bypassing the gate is the right call
# per ADR-0008. Mirrored in osv-scanner.toml — the two files must be kept in
# sync, dropped together once each version clears 14 days.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg # brace-expansion DoS; fix 5.0.9 published 2026-09-14, clears 2026-09-28
    - GHSA-rgw5-rvv9-x895 # brace-expansion DoS (mitigation bypass); same fix/date as above
    - GHSA-mwp4-54f8-5fhr # ip-address SSRF; fix 10.3.1 published 2026-09-15, clears 2026-09-29
    - GHSA-28wg-ghj8-5hjv # nanoid infinite loop (negative size); fix 3.3.18 published 2026-09-10, clears 2026-09-24
    - GHSA-2v37-7h3g-55p8 # nanoid infinite loop (size zero); same fix/date as above
