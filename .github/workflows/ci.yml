# One workflow, both language paths. `detect` looks for Cargo.toml / package.json
# and the language jobs skip themselves when their manifest isn't there — so a
# TS-only or Rust-only project needs no edits, and a project that grows a second
# language needs none either.
#
# EVERY third-party action is pinned to a full-length commit SHA, not a tag.
# Tags are mutable: the tj-actions/changed-files compromise (CVE-2025-30066)
# worked by repointing existing version tags at a malicious commit, and GitHub's
# own guidance calls a SHA "the only way to use an action as an immutable
# release". The trailing comment records the human-readable version — keep it
# accurate when you bump, since the SHA alone tells you nothing.
#
# Note dtolnay/rust-toolchain@stable is a *branch*, which moves by design — the
# pin matters most there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    name: detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      ts: ${{ steps.d.outputs.ts }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - id: d
        run: |
          set -euo pipefail
          rust=false; ts=false
          [ -f Cargo.toml ] && rust=true
          [ -f package.json ] && ts=true
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "rust=$rust ts=$ts"

  # ── Rust ────────────────────────────────────────────────────────────────────
  # None. ADR-0001 records that cycle-in has no Rust core, so the template's rust-gates,
  # rust-proofs (Kani) and rust-supply-chain jobs are deleted rather than left skipping
  # (ADR-1004's "not using Kani? record it in a project ADR and delete the job"). If a Rust/WASM
  # core arrives (ADR-1015), copy them back from the template with its harness guard.

  # ── TypeScript ──────────────────────────────────────────────────────────────
  ts-gates:
    name: ts fast gates
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24 # ADR-1013
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: any registry (ADR-0018)
        run: pnpm casts
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  ts-supply-chain:
    name: ts supply chain
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24 # ADR-1013
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: known-vulnerability audit
        run: pnpm audit --audit-level=high
      - name: signatures + provenance
        # A different question from the audit above: that one asks "is this
        # version on a known-bad list", this asks "was this tarball actually
        # published by who the registry says, and built where it claims".
        run: pnpm audit signatures
      - name: license allowlist
        run: >
          pnpm exec license-checker-rseidelsohn
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Python-2.0;BlueOak-1.0.0;MPL-2.0;CC-BY-3.0"
          --excludePrivatePackages

  # ADR-0019: axe (WCAG 2.1 A/AA) against every view, in light and dark, on the built site.
  e2e:
    name: e2e (playwright + axe)
    needs: detect
    if: needs.detect.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24 # ADR-1013
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An explicit, version-pinned download from Playwright's CDN — nothing is fetched at install
      # time (ADR-0006). The browser runs tests only and never ships, so it's outside the SBOM.
      - name: install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # ── Shared ──────────────────────────────────────────────────────────────────
  sbom:
    name: SBOM
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # Syft scans the project directly — a single static binary, no npm or cargo
      # dependency of its own, so it sidesteps package-manager layout problems.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cdx.json

  osv-scan:
    name: OSV scan
    needs: detect
    # Only when there's a dependency manifest to scan. Without this the template
    # repo itself — which has no Cargo.toml or package.json — goes red on a scan
    # of nothing, and a template whose own CI is failing teaches the wrong thing.
    if: needs.detect.outputs.rust == 'true' || needs.detect.outputs.ts == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    # Reusable workflow — pinned by tag because `uses:` on a reusable workflow
    # resolves a ref in that repo the same way; bump deliberately.
    # No timeout-minutes here (ADR-1005's one exception): GitHub rejects it on a job that calls a
    # reusable workflow; the called workflow's own jobs carry their limits.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8

  # Runs on every project, with or without a manifest: a secret can be committed to any repo.
  # Not a marketplace action: gitleaks-action needs a paid license on organisation accounts, and
  # an action is one more mutable dependency. Instead the release binary is fetched at a pinned
  # version and verified against a pinned SHA-256 before it runs. Bump both together
  # (the checksum is on the release page, in gitleaks_<version>_checksums.txt).
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false
      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      # --redact keeps a real finding's value out of the (possibly public) build log.
      - name: scan history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  deploy:
    name: deploy to Pages
    needs: [ts-gates, ts-supply-chain, secret-scan, e2e]
    # Opt in per project: Settings → Variables → DEPLOY_PAGES = true.
    # Remember `base` must match the repo name or every asset 404s.
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # ADR-1005
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
